server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: civicops-community-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${SQL_HOST:localhost}:5432/${SQL_DB_NAME:civicops_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${SQL_USER:civicops_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${SQL_PASSWORD:civicops_password}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
