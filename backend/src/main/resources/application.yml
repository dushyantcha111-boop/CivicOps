server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: civicops-community-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${SQL_HOST:localhost}:${SQL_PORT:5432}/${SQL_DB_NAME:civicops_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${SQL_USER:civicops_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${SQL_PASSWORD:civicops_password}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://*.netlify.app}
