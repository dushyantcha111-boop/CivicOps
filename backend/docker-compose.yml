services:
  postgres:
    image: postgres:15-alpine
    container_name: civicops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SQL_DB_NAME:-civicops_db}
      POSTGRES_USER: ${SQL_USER:-civicops_user}
      POSTGRES_PASSWORD: ${SQL_PASSWORD:-civicops_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER:-civicops_user} -d ${SQL_DB_NAME:-civicops_db}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: .
    container_name: civicops-spring-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${SQL_DB_NAME:-civicops_db}
      SPRING_DATASOURCE_USERNAME: ${SQL_USER:-civicops_user}
      SPRING_DATASOURCE_PASSWORD: ${SQL_PASSWORD:-civicops_password}
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-64-char-random-secret-in-production-env-only}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,https://*.netlify.app}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
